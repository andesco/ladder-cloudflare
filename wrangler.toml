name = "ladder"
main = "index.js"
compatibility_date = "2025-09-13"
# account_id = "" # optional: your unqiue Cloudflare account ID

workers_dev = true # enable {name}.{account}.workers.dev
preview_urls = true # enable version/alias preview URLs: {preview}-{name}.{account}.workers.dev

# [[routes]]
# pattern = "ladder.example.com"
# custom_domain = true

[assets]
directory = "./public"

[vars]
VERSION = "0.0.0"
EXPOSE_RULESET = "true"

# Optional: if set, the scheduled cron will fetch manifest.json and update BPC ruleset in KV.
# RULESET_URL = "https://example.com/manifest.json"

# USER_AGENT = "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
# USERPASS = "username:password"
# ALLOWED_DOMAINS = "example.com,example.org"
# ALLOWED_DOMAINS_RULESET = "false"
# X_FORWARDED_FOR = "66.249.66.1"
# DISABLE_FORM = "false"

[triggers]
# Check for BPC ruleset updates daily at 12:00 UTC (noon GMT).
crons = ["0 12 * * *"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

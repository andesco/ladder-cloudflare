name = "bypasser"
main = "index.js"
compatibility_date = "2026-05-27"
# account_id = "" # optional: your unique Cloudflare account ID

workers_dev = true
preview_urls = true

[[routes]]
pattern = "bypasser.example.com"
custom_domain = true

[assets]
directory = "./public"

[vars]
VERSION = "0.0.0"
EXPOSE_RULESET = "true"
RULESET_URL = "https://bypass.example.com/manifest.json"
ALLOWED_DOMAINS_RULESET = "true"

[triggers]
crons = ["0 12 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "your-kv-namespace-id"
